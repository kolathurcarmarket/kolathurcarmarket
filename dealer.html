<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Dealer Dashboard — DriveDesk</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="app-shell">
  <header class="app-topbar">
    <div class="brand">
      <span class="brand__mark">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M3 13l1.6-4.8A2 2 0 0 1 6.5 7h11a2 2 0 0 1 1.9 1.2L21 13" stroke="#F0A63A" stroke-width="1.6" stroke-linecap="round"/>
          <rect x="2.5" y="13" width="19" height="6" rx="1.6" stroke="#F0A63A" stroke-width="1.6"/>
          <circle cx="7" cy="19" r="1.6" fill="#0E1013" stroke="#F0A63A" stroke-width="1.4"/>
          <circle cx="17" cy="19" r="1.6" fill="#0E1013" stroke="#F0A63A" stroke-width="1.4"/>
        </svg>
      </span>
      <span class="brand__name">Drive<span>Desk</span></span>
    </div>
    <div class="topbar-user">
      <div class="who">
        <div class="name" id="current-username">—</div>
        <div class="role" id="current-shop">Dealer</div>
      </div>
      <span class="avatar" id="avatar-initials">—</span>
      <button class="btn btn--ghost btn--sm" id="logout-btn">Log out</button>
    </div>
  </header>

  <main class="app-main">
    <div class="page-head">
      <div>
        <h1>Your lot</h1>
        <p>Add, edit, and mark your listings sold — updates go live instantly.</p>
      </div>
      <button class="btn btn--primary" id="btn-open-add-car">+ Add a car</button>
    </div>

    <section class="stats-row" style="grid-template-columns:repeat(3,1fr);">
      <div class="stat-card">
        <div class="label">Total listings</div>
        <div class="value" id="stat-listings">0</div>
      </div>
      <div class="stat-card">
        <div class="label">Available</div>
        <div class="value" id="stat-available">0</div>
      </div>
      <div class="stat-card">
        <div class="label">Sold</div>
        <div class="value" id="stat-sold">0</div>
      </div>
    </section>

    <div class="toolbar">
      <div class="filter-chips">
        <button class="status-filter active" data-status="all">All</button>
        <button class="status-filter" data-status="available">Available</button>
        <button class="status-filter" data-status="sold">Sold</button>
      </div>
      <input type="search" class="search-input" id="car-search" placeholder="Search make, model, color…" />
    </div>

    <div class="cars-grid" id="cars-grid">
      <div class="empty-row">Loading your listings…</div>
    </div>
  </main>
</div>

<!-- Add / edit car modal -->
<div class="modal-backdrop" id="car-modal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="car-modal-title">
    <div class="modal-head">
      <h2 id="car-modal-title">Add a car</h2>
      <button class="modal-close" data-close-modal aria-label="Close">&times;</button>
    </div>
    <form id="form-car" novalidate>
      <div class="form-grid">
        <div class="field">
          <label for="car-make">Make</label>
          <input type="text" id="car-make" placeholder="e.g. Maruti Suzuki" required />
        </div>
        <div class="field">
          <label for="car-model">Model</label>
          <input type="text" id="car-model" placeholder="e.g. Swift" required />
        </div>
        <div class="field">
          <label for="car-year">Year</label>
          <input type="number" id="car-year" min="1980" max="2100" placeholder="2019" />
        </div>
        <div class="field">
          <label for="car-price">Price (₹)</label>
          <input type="number" id="car-price" min="0" placeholder="450000" />
        </div>
        <div class="field">
          <label for="car-km">Kilometers driven</label>
          <input type="number" id="car-km" min="0" placeholder="42000" />
        </div>
        <div class="field">
          <label for="car-color">Color</label>
          <input type="text" id="car-color" placeholder="e.g. Pearl White" />
        </div>
        <div class="field">
          <label for="car-fuel">Fuel type</label>
          <select id="car-fuel">
            <option>Petrol</option>
            <option>Diesel</option>
            <option>CNG</option>
            <option>Electric</option>
            <option>Hybrid</option>
          </select>
        </div>
        <div class="field">
          <label for="car-trans">Transmission</label>
          <select id="car-trans">
            <option>Manual</option>
            <option>Automatic</option>
          </select>
        </div>
        <div class="field field--full">
          <label for="car-image">Photo URL</label>
          <input type="url" id="car-image" placeholder="https://…" />
        </div>
        <div class="field field--full">
          <label for="car-desc">Description</label>
          <textarea id="car-desc" placeholder="Condition, service history, extra features…"></textarea>
        </div>
      </div>
      <p class="form-error" id="car-form-error" role="alert"></p>
      <button type="submit" class="btn btn--primary btn--block" id="btn-save-car">Save listing</button>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/utils.js"></script>
<script src="js/dealer.js"></script>
</body>
</html>
